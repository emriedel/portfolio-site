<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#f5f5f2">
<title>The gallery</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Caveat:wght@600&display=swap">
<style>
:root {
  --wall: #f5f5f2;
  --ink: #1c1c1a;
  --soft: #6d6d67;
  --line: #d9d9d3;
  --frame: #1c1c1a;
  --mat: #fff;
  --tape: #e7dab4;
  --pen: #222220;
  --check: #2e8540;
  --wrong: #c43d2b;
  --focus: #2563d6;
  --c-red: #c8433a;
  --c-yellow: #e0b533;
  --c-green: #3d8b57;
  --c-blue: #3a71c1;
  --sans: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --hand: "Caveat", "Noteworthy", "Bradley Hand", cursive;
  --gap: clamp(8px, 2.6vw, 20px);
  --ratio: 1.2;                 /* frame height ÷ width */
  /* masking tape, torn at both ends */
  --torn: polygon(2% 0, 98% 0, 100% 18%, 97% 35%, 100% 52%, 97% 70%, 100% 86%, 98% 100%, 2% 100%, 0 84%, 3% 66%, 0 50%, 3% 33%, 0 16%);
  color-scheme: light;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  background: var(--wall);
  color: var(--ink);
  font: 400 17px/1.5 var(--sans);
  padding-inline: max(18px, env(safe-area-inset-left)) max(18px, env(safe-area-inset-right));
  padding-block: max(20px, env(safe-area-inset-top)) max(28px, env(safe-area-inset-bottom));
  -webkit-tap-highlight-color: transparent;
}
main, #reward { max-width: 620px; margin: 0 auto; }

h1 { font-size: 1.75rem; line-height: 1.2; font-weight: 700; margin: 4px 0 12px; }
.poem { margin: 0; }
.poem span { display: block; padding-left: 1.2em; text-indent: -1.2em; text-wrap: balance; }

/* The wall: 3 rows of 5, with some columns hung lower, as at home. */
.wall-wrap { margin-top: 32px; }
.wall {
  display: grid;
  grid-template-columns: repeat(var(--cols, 5), minmax(0, 1fr));
  column-gap: var(--gap);
  row-gap: calc(var(--gap) * 1.6);
  /* room for the lowered columns */
  padding-bottom: calc((100% - (var(--cols, 5) - 1) * var(--gap)) / var(--cols, 5) * var(--ratio) * var(--max-drop, 0));
}
.slot {
  position: relative;
  aspect-ratio: 1 / var(--ratio);
  transform: translateY(calc(var(--drop, 0) * 100%));
  padding: 0;
  border: 0;
  background: none;
  color: inherit;
  font: inherit;
  cursor: pointer;
  touch-action: manipulation;
}
.frame {
  position: absolute; inset: 0;
  border: max(2px, .55vw) solid var(--frame);
  background: var(--mat);
  box-shadow: 0 1px 2px rgba(0, 0, 0, .14);
}
.frame::before {              /* the edge of the mat's window */
  content: "";
  position: absolute; inset: 13%;
  border: 1px solid var(--line);
}
.frame.empty::after {
  content: "+";
  position: absolute; inset: 0;
  display: grid; place-items: center;
  color: #b3b3ac;
  font-size: 1.25rem;
}
.tape {
  position: absolute;
  left: -7%; right: -7%; top: 44%;
  transform: translateY(-50%) rotate(var(--tilt, 0deg));
  padding: 5px 4px;
  background: var(--tape);
  clip-path: var(--torn);
  color: var(--pen);
  font: 600 clamp(.9rem, 4vw, 1.3rem)/.95 var(--hand);
  text-align: center;
  text-wrap: balance;
  overflow-wrap: break-word;
}
.check {
  position: absolute;
  right: 5%; bottom: 4%;
  width: 34%;
  fill: none;
  stroke: var(--check);
  stroke-width: 3.4;
  stroke-linecap: round;
  stroke-linejoin: round;
  pointer-events: none;
}
.check.draw path { stroke-dasharray: 30; stroke-dashoffset: 30; animation: draw .3s ease-out forwards; animation-delay: calc(var(--col) * 90ms); }
.slot.locked { cursor: default; }
.slot.target .frame { outline: 2px solid var(--focus); outline-offset: 3px; }
.slot:focus-visible { outline: none; }
.slot:focus-visible .frame { outline: 2px solid var(--focus); outline-offset: 3px; }
.slot.wrong .frame { animation: shake .42s; }
.slot.wrong .tape { color: var(--wrong); }
@keyframes shake { 20%, 60% { transform: translateX(-3px); } 40%, 80% { transform: translateX(3px); } }
@keyframes draw { to { stroke-dashoffset: 0; } }

.count { color: var(--soft); margin: 22px 0 0; }
.status { margin: 4px 0 0; min-height: 1.5em; font-weight: 600; }
.actions { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 18px; margin-top: 14px; }

.btn {
  font: 600 1rem/1 var(--sans);
  min-height: 48px;
  padding: 0 20px;
  border: 0;
  border-radius: 4px;
  cursor: pointer;
  touch-action: manipulation;
}
.btn.primary { background: var(--ink); color: #fff; }
.btn.primary:disabled { background: #c9c9c3; cursor: default; }
.btn.text { background: none; color: var(--ink); font-weight: 400; padding: 0 2px; text-decoration: underline; text-underline-offset: 3px; }
.btn:focus-visible { outline: 2px solid var(--focus); outline-offset: 3px; }

/* The pile of labels slides up from the bottom; the wall stays tappable above it. */
.sheet {
  position: fixed; left: 0; right: 0; bottom: 0;
  max-width: 660px; margin: 0 auto;
  max-height: 48vh; max-height: 48dvh;
  display: flex; flex-direction: column;
  background: #fff;
  border-top: 1px solid var(--line);
  border-radius: 10px 10px 0 0;
  box-shadow: 0 -6px 20px rgba(0, 0, 0, .08);
  padding: 12px max(16px, env(safe-area-inset-left)) max(12px, env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-right));
  animation: rise .2s ease-out;
}
@keyframes rise { from { transform: translateY(100%); } }
.sheet-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding-bottom: 6px; }
.sheet-head h2 { font-size: 1.0625rem; font-weight: 600; margin: 0; }
.sheet-head h2:focus { outline: none; }
.sheet .btn { min-height: 40px; padding: 0 16px; }
.sheet-list {
  overflow-y: auto; overscroll-behavior: contain;
  display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
  gap: 12px 14px;
  padding: 10px 6px 12px;
}
.park {
  position: relative;
  isolation: isolate;
  min-height: 44px;
  padding: 6px 12px;
  border: 0;
  background: none;
  color: var(--pen);
  font: 600 1.375rem/1 var(--hand);
  transform: rotate(var(--tilt, 0deg));
  cursor: pointer;
  touch-action: manipulation;
}
.park::before { content: ""; position: absolute; inset: 0; z-index: -1; background: var(--tape); clip-path: var(--torn); }
.park:active::before { filter: brightness(.94); }
.park:disabled { opacity: .3; filter: grayscale(1); cursor: default; }
.park:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
.sheet-foot { padding-top: 4px; }

/* The reward: one more picture for the wall. */
#reward h1:focus { outline: none; }
.prize { display: flex; align-items: flex-end; gap: 18px; margin: 28px 0 26px; }
.prize-frame {
  flex: none;
  width: min(44vw, 200px);
  aspect-ratio: 1 / var(--ratio);
  padding: 12%;
  border: max(3px, .7vw) solid var(--frame);
  background: var(--mat);
  box-shadow: 0 1px 2px rgba(0, 0, 0, .14);
}
.digit {
  display: grid; place-items: center;
  height: 100%;
  background: var(--tile, var(--c-blue));
  color: #fff;
  font: 600 clamp(4.5rem, 24vw, 8rem)/1 var(--hand);
}
.plaque { margin: 0; padding-bottom: 4px; color: var(--soft); }
.plaque b { display: block; font-size: 1.375rem; color: var(--ink); }
#reward .poem { margin-bottom: 26px; }
/* Slide only, no fade: if the animation never runs, the reward still shows. */
.rise { animation: rise-in .45s ease-out; }
@keyframes rise-in { from { transform: translateY(16px); } }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
  .check.draw path { stroke-dashoffset: 0; }
}
</style>
</head>
<body>
<main id="puzzle">
  <h1 id="title"></h1>
  <p class="poem" id="poem"></p>
  <section class="wall-wrap" aria-label="The wall">
    <div class="wall" id="wall"></div>
  </section>
  <p class="count" id="count"></p>
  <p class="status" id="status" role="status" aria-live="polite"></p>
  <div class="actions">
    <button class="btn primary" id="check" type="button" disabled>Check the wall</button>
    <button class="btn primary" id="see-reward" type="button" hidden>Back to the reward</button>
    <button class="btn text" id="clear" type="button" hidden>Take them all down</button>
  </div>
</main>

<section id="reward" hidden>
  <h1 id="r-title" tabindex="-1"></h1>
  <div class="prize" id="r-prize">
    <div class="prize-frame"><span class="digit" id="r-digit"></span></div>
    <p class="plaque" id="r-plaque"></p>
  </div>
  <p class="poem" id="r-lines"></p>
  <button class="btn text" id="r-back" type="button">Look at the wall again</button>
</section>

<div class="sheet" id="sheet" role="dialog" aria-labelledby="sheet-title" hidden>
  <div class="sheet-head">
    <h2 id="sheet-title" tabindex="-1"></h2>
    <button class="btn primary" id="sheet-done" type="button">Done</button>
  </div>
  <div class="sheet-list" id="sheet-list"></div>
  <div class="sheet-foot" id="sheet-foot" hidden>
    <button class="btn text" id="take-down" type="button">Take this one down</button>
  </div>
</div>

<script>const PUZZLE = {"title":"The gallery","poem":["Fifteen parks share a wall in a place you’ve been,","in three rows of five, every summit and scene.","Their labels fell off, and they’ve all landed here:","hang each by its picture, and the next step is clear."],"rows":3,"cols":5,"rowNames":["top","middle","bottom"],"drop":[0,0.5,0,0.5,0],"parks":[{"id":"arches","name":"Arches"},{"id":"bryce-canyon","name":"Bryce Canyon"},{"id":"canyonlands","name":"Canyonlands","short":"Canyon­lands"},{"id":"capitol-reef","name":"Capitol Reef"},{"id":"crater-lake","name":"Crater Lake"},{"id":"glacier-bay","name":"Glacier Bay"},{"id":"hawai-i-volcanoes","name":"Hawai‘i Volcanoes","short":"Hawai‘i Volca­noes"},{"id":"joshua-tree","name":"Joshua Tree"},{"id":"mount-rainier","name":"Mount Rainier"},{"id":"north-cascades","name":"North Cascades"},{"id":"olympic","name":"Olympic"},{"id":"redwood","name":"Redwood"},{"id":"yellowstone","name":"Yellowstone","short":"Yellow­stone"},{"id":"yosemite","name":"Yosemite"},{"id":"zion","name":"Zion"}],"iterations":60000,"salt":"46U3nRSkuhIEYuM+QkFvQw==","rowHash":["f9dd0ccf1c58b2176bbe650cc1b6a77a714d8dffed47118eb6547b9212077e7e","d063bbdaa54260fa6b4a5535e864efc3441d0455d745eeddc52bce80754bbfba","6a79cadd0e8f8cbc5cb3b3d33bee74c47f3cc8348a426bb9b4dcb612a7552efa"],"reward":{"iv":"SOw13peIvd4zGVNw","ct":"MDEV4hS7RAgGv3vEcZM6y0yZ7Yn3RrCEIMdbRW798pPaIvn2aehU26xsy7+yM88aePun+Sqf+YugsqwiVVQQIERvNBwI37udV9G+ZcuMcV+VZWVdfbfUcHcxnekh34vG/u37+iKGOEPEwXGXbgzA/HKQpBhgvjmIJ3NAvESIDxYtglWwe7MzVt0Gsyj7kxJtaH2dYhUAut8X3VzLJRD+yWPCdVdYWjJqauqcOjjIyFW0pouIzkasrteyvKEtEvMWrYldUWoI3ublsQPbh8GHdsCRo+AAoq5rWO5enkrpFJr2j9D8xusbbOLyYwHHapFGPOVDjTzdAxyc6xWFddvw8KLmsDl1EGIRicuQO8B+CcsyJ8Q8t80qtbE9aqVIRToPaF+GPGjKiKSqu4xuwRRo"}};</script>
<script>
(() => {
  "use strict";
  const P = PUZZLE;
  const N = P.rows * P.cols;
  const $ = (id) => document.getElementById(id);
  const byId = new Map(P.parks.map((p) => [p.id, p]));
  const enc = new TextEncoder();
  const b64 = (s) => Uint8Array.from(atob(s), (c) => c.charCodeAt(0));
  const hex = (buf) => Array.from(new Uint8Array(buf), (b) => b.toString(16).padStart(2, "0")).join("");
  const cap = (s) => s.charAt(0).toUpperCase() + s.slice(1);
  const wait = (ms) => new Promise((r) => setTimeout(r, ms));
  const reduced = matchMedia("(prefers-reduced-motion: reduce)").matches;
  const STORE = "gallery:" + P.salt.slice(0, 12);
  const SVG = "http://www.w3.org/2000/svg";

  let place = Array(N).fill(null); // park id labeling each frame, reading order
  let locked = Array(P.rows).fill(false);
  let justLocked = [];             // rows whose check marks should draw in
  let solved = null;               // the decrypted reward, once all rows are right
  let target = null;               // the frame the label pile is choosing for
  let busy = false;
  let clearArmed = 0;

  const rowOf = (i) => Math.floor(i / P.cols);
  const rowIds = (r) => place.slice(r * P.cols, (r + 1) * P.cols);
  const where = (i) => P.rowNames[rowOf(i)] + " row, frame " + (i % P.cols + 1);
  const rowsPhrase = (rs) => {
    const names = rs.map((r) => P.rowNames[r]);
    const list = names.length === 1 ? names[0] : names.slice(0, -1).join(", ") + " and " + names[names.length - 1];
    return "the " + list + " row" + (rs.length > 1 ? "s" : "");
  };
  // Each label keeps the same slight tilt wherever it appears.
  const tilt = (id) => {
    let h = 0;
    for (const c of id) h = (h * 31 + c.charCodeAt(0)) | 0;
    return ((Math.abs(h) % 7) - 3) * 0.8 + "deg";
  };
  const el = (tag, cls, text) => {
    const e = document.createElement(tag);
    if (cls) e.className = cls;
    if (text != null) e.textContent = text;
    return e;
  };

  // Progress survives a refresh or a locked phone.
  function save() {
    try { localStorage.setItem(STORE, JSON.stringify({ place, locked })); } catch (e) {}
  }
  function load() {
    try {
      const s = JSON.parse(localStorage.getItem(STORE) || "null");
      if (s && s.place.length === N && s.place.every((id) => id === null || byId.has(id))) {
        place = s.place;
        locked = s.locked;
      }
    } catch (e) {}
  }

  // The page never holds the answer: only salted hashes of each row and a
  // reward encrypted with the whole wall.
  async function derive(text) {
    const base = await crypto.subtle.importKey("raw", enc.encode(text), "PBKDF2", false, ["deriveBits"]);
    return crypto.subtle.deriveBits({ name: "PBKDF2", salt: b64(P.salt), iterations: P.iterations, hash: "SHA-256" }, base, 256);
  }
  async function rowIsRight(r) {
    return hex(await derive("row" + r + ":" + rowIds(r).join(","))) === P.rowHash[r];
  }
  async function openReward() {
    const bits = await derive("all:" + place.join(","));
    const key = await crypto.subtle.importKey("raw", bits, "AES-GCM", false, ["decrypt"]);
    const plain = await crypto.subtle.decrypt({ name: "AES-GCM", iv: b64(P.reward.iv) }, key, b64(P.reward.ct));
    return JSON.parse(new TextDecoder().decode(plain));
  }

  // ---- The wall ----
  const wall = $("wall");
  wall.style.setProperty("--cols", P.cols);
  wall.style.setProperty("--max-drop", Math.max(...P.drop));
  const slots = [];
  for (let i = 0; i < N; i++) {
    const b = el("button", "slot");
    b.type = "button";
    b.style.setProperty("--drop", P.drop[i % P.cols]);
    b.addEventListener("click", () => { if (!locked[rowOf(i)]) openSheet(i); });
    wall.appendChild(b);
    slots.push(b);
  }

  function checkMark(col, draw) {
    const svg = document.createElementNS(SVG, "svg");
    svg.setAttribute("viewBox", "0 0 24 24");
    svg.setAttribute("class", "check" + (draw ? " draw" : ""));
    svg.setAttribute("aria-hidden", "true");
    svg.style.setProperty("--col", col);
    const path = document.createElementNS(SVG, "path");
    path.setAttribute("d", "M3.5 13.5 L9 19 L21 5");
    svg.appendChild(path);
    return svg;
  }

  function render() {
    slots.forEach((b, i) => {
      const id = place[i];
      const isLocked = locked[rowOf(i)];
      b.classList.toggle("locked", isLocked);
      b.classList.toggle("target", i === target);
      b.setAttribute("aria-disabled", isLocked);
      b.setAttribute("aria-label", cap(where(i)) + ": " + (id ? byId.get(id).name : "empty") + (isLocked ? ", correct" : ""));
      const key = (id || "") + (isLocked ? "!" : "");
      if (b.dataset.key === key) return;
      b.dataset.key = key;
      const frame = el("span", id ? "frame" : "frame empty");
      const parts = [frame];
      if (id) {
        const p = byId.get(id);
        const tape = el("span", "tape", p.short || p.name);
        tape.style.setProperty("--tilt", tilt(id));
        frame.appendChild(tape);
      }
      if (isLocked) parts.push(checkMark(i % P.cols, justLocked.includes(rowOf(i)) && !reduced));
      b.replaceChildren(...parts);
    });
    justLocked = [];
    const hung = place.filter(Boolean).length;
    $("count").textContent = solved ? "Every row is right."
      : hung === 0 ? "Tap a frame to hang a park in it."
      : hung === N ? "All " + N + " are hung. Check the wall when you’re ready."
      : hung + " of " + N + " hung.";
    const checkable = locked.some((l, r) => !l && rowIds(r).every(Boolean));
    $("check").disabled = busy || !checkable;
    $("check").hidden = !!solved;
    $("see-reward").hidden = !solved;
    $("clear").hidden = !!solved || !place.some((id, i) => id && !locked[rowOf(i)]);
  }

  function say(text) { $("status").textContent = text; }

  // ---- The pile of labels ----
  const sheet = $("sheet");

  function openSheet(i) {
    const wasOpen = !sheet.hidden;
    target = i;
    renderSheet();
    sheet.hidden = false;
    render();
    // Leave room to scroll the wall up above the sheet.
    document.body.style.paddingBottom = sheet.offsetHeight + 24 + "px";
    if (!wasOpen) $("sheet-title").focus({ preventScroll: true });
    reveal(i);
  }

  // Keep the chosen frame in view above the sheet: the whole wall if it
  // fits, otherwise just that frame.
  function reveal(i) {
    const limit = innerHeight - sheet.offsetHeight - 16;
    const w = wall.getBoundingClientRect();
    const r = slots[i].getBoundingClientRect();
    let dy = 0;
    if (w.height <= limit - 12) { if (w.top < 12 || w.bottom > limit) dy = w.top - 12; }
    else if (r.bottom > limit) dy = r.bottom - limit;
    else if (r.top < 12) dy = r.top - 12;
    if (dy) scrollBy({ top: dy, behavior: reduced ? "auto" : "smooth" });
  }

  function closeSheet() {
    if (sheet.hidden) return;
    const back = slots[target];
    sheet.hidden = true;
    target = null;
    document.body.style.paddingBottom = "";
    render();
    if (back) back.focus({ preventScroll: true });
  }

  function renderSheet() {
    $("sheet-title").textContent = cap(where(target));
    const lockedIds = new Set(place.filter((id, i) => id && locked[rowOf(i)]));
    const items = P.parks.filter((p) => !lockedIds.has(p.id)).map((p) => {
      const b = el("button", "park", p.name);
      b.type = "button";
      b.disabled = place.includes(p.id); // already on the wall
      b.style.setProperty("--tilt", tilt(p.id));
      b.addEventListener("click", () => hang(p.id));
      return b;
    });
    $("sheet-list").replaceChildren(...items);
    $("sheet-foot").hidden = !place[target];
  }

  function nextEmpty(from) {
    for (let k = 1; k <= N; k++) {
      const j = (from + k) % N;
      if (!place[j] && !locked[rowOf(j)]) return j;
    }
    return null;
  }

  function hang(id) {
    const i = target;
    const was = place[i];
    place[i] = id; // a label it replaces goes back on the pile
    changed();
    // Filling an empty frame moves on to the next empty one, so a team
    // standing at the wall can go left to right without closing the pile.
    const next = was ? null : nextEmpty(i);
    if (next !== null) openSheet(next); else closeSheet();
  }

  function takeDown() {
    place[target] = null;
    changed();
    renderSheet();
  }

  function changed() {
    save();
    say("");
    render();
  }

  // ---- Checking ----
  async function check() {
    if (busy) return;
    closeSheet();
    busy = true;
    $("check").textContent = "Checking…";
    render();
    const right = [], wrong = [];
    try {
      for (let r = 0; r < P.rows; r++) {
        if (locked[r] || !rowIds(r).every(Boolean)) continue;
        (await rowIsRight(r) ? right : wrong).push(r);
      }
    } catch (e) {
      busy = false;
      $("check").textContent = "Check the wall";
      render();
      say("This page can’t check answers here. Open it over https.");
      return;
    }
    right.forEach((r) => { locked[r] = true; });
    justLocked = right;
    busy = false;
    $("check").textContent = "Check the wall";
    save();
    render();

    if (locked.every(Boolean)) { say("Every row is right."); return solve(false); }
    const msg = [];
    if (right.length) msg.push(cap(rowsPhrase(right)) + (right.length > 1 ? " are" : " is") + " right.");
    if (wrong.length) msg.push(cap(rowsPhrase(wrong)) + (wrong.length > 1 ? " aren’t" : " isn’t") + " right yet.");
    say(msg.join(" "));
    if (wrong.length) {
      const bad = slots.filter((b, i) => wrong.includes(rowOf(i)));
      bad.forEach((b) => b.classList.add("wrong"));
      if (navigator.vibrate) navigator.vibrate([40, 60, 40]);
      setTimeout(() => bad.forEach((b) => b.classList.remove("wrong")), 900);
    }
  }

  async function solve(restoring) {
    try {
      solved = await openReward();
    } catch (e) {
      say("Every row checks out, but the reward wouldn’t open. Text the host.");
      return;
    }
    render();
    if (!restoring && !reduced) await wait(1100); // let the last check marks draw in
    showReward(!restoring);
  }

  function showReward(animate) {
    const R = solved;
    $("r-title").textContent = R.title;
    $("r-prize").hidden = !R.digit;
    if (R.digit) {
      const c = R.digit.color;
      document.documentElement.style.setProperty("--tile", /^[a-z]+$/.test(c) ? "var(--c-" + c + ")" : c);
      $("r-digit").textContent = R.digit.value;
      $("r-plaque").replaceChildren(el("b", null, cap(c)), document.createTextNode("Write it in the " + c + " box."));
    }
    $("r-lines").replaceChildren(...(R.lines || []).map((t) => el("span", null, t)));
    $("puzzle").hidden = true;
    const view = $("reward");
    view.hidden = false;
    view.classList.toggle("rise", animate && !reduced);
    window.scrollTo(0, 0);
    $("r-title").focus({ preventScroll: true });
  }

  // ---- Wiring ----
  $("title").textContent = P.title;
  document.title = P.title;
  $("poem").replaceChildren(...P.poem.map((t) => el("span", null, t)));
  $("check").addEventListener("click", check);
  $("sheet-done").addEventListener("click", closeSheet);
  $("take-down").addEventListener("click", takeDown);
  $("see-reward").addEventListener("click", () => showReward(false));
  $("r-back").addEventListener("click", () => {
    $("reward").hidden = true;
    $("puzzle").hidden = false;
    window.scrollTo(0, 0);
  });
  $("clear").addEventListener("click", () => {
    const btn = $("clear");
    if (Date.now() - clearArmed > 3000) {
      clearArmed = Date.now();
      btn.textContent = "Tap again to take them all down";
      setTimeout(() => { btn.textContent = "Take them all down"; }, 3000);
      return;
    }
    clearArmed = 0;
    btn.textContent = "Take them all down";
    place = place.map((id, i) => (locked[rowOf(i)] ? id : null));
    changed();
  });
  document.addEventListener("keydown", (e) => { if (e.key === "Escape") closeSheet(); });

  load();
  render();
  if (!window.crypto || !crypto.subtle) say("This page can’t check answers here. Open it over https.");
  else if (locked.every(Boolean)) solve(true);
})();
</script>

</html>
